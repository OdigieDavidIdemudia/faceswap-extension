<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local FaceSwap</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header-glow"></div>
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="15" stroke="url(#grad)" stroke-width="2"/>
          <circle cx="11" cy="13" r="3" fill="url(#grad)" opacity="0.9"/>
          <circle cx="21" cy="13" r="3" fill="url(#grad)" opacity="0.9"/>
          <path d="M8 22 Q16 28 24 22" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" fill="none"/>
          <path d="M4 16 L8 12 L12 16" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M28 16 L24 12 L20 16" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#818cf8"/>
              <stop offset="100%" stop-color="#c084fc"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="logo-text">FaceSwap <span class="badge">LOCAL AI</span></span>
      </div>
      <div id="server-status" class="status-dot status-checking" title="Checking server..."></div>
    </header>

    <!-- Server Settings (Hidden by default, toggle with logo or footer) -->
    <div id="server-settings" class="card" style="margin-bottom: 12px; padding: 8px;">
      <div style="display: flex; gap: 8px; align-items: center;">
        <input type="text" id="api-url-input" placeholder="http://localhost:8000" style="flex: 1; background: #000; border: 1px solid var(--border); border-radius: 4px; color: #fff; padding: 4px; font-size: 11px;">
        <button id="save-url-btn" style="background: var(--accent); color: white; border: none; border-radius: 4px; padding: 4px 8px; font-size: 10px; cursor: pointer;">Save</button>
      </div>
      <div style="font-size: 9px; opacity: 0.6; margin-top: 4px; text-align: center;">Set your Local IP or Cloud URL here.</div>
    </div>

    <!-- Upload Zone: Source Face -->
    <section class="card" id="source-card">
      <div class="card-label">
        <span class="step-num">1</span>
        <span>Source Face</span>
        <span class="hint">The face to use</span>
      </div>
      <label class="drop-zone" id="source-drop" for="source-input">
        <input type="file" id="source-input" accept="image/*" hidden />
        <div class="drop-inner" id="source-inner">
          <svg class="drop-icon" viewBox="0 0 24 24" fill="none">
            <path d="M12 16V8M12 8l-3 3M12 8l3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="3" y="3" width="18" height="18" rx="4" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2"/>
          </svg>
          <span class="drop-text">Click or drag an image</span>
        </div>
        <img class="preview-img hidden" id="source-preview" alt="Source preview" />
      </label>
    </section>

    <!-- Mode Selection -->
    <div class="mode-toggle-wrap">
      <div class="mode-toggle">
        <button class="mode-btn active" id="mode-file">File Mode</button>
        <button class="mode-btn" id="mode-camera">Camera Mode</button>
      </div>
    </div>
    
    <!-- Face Selection (Visible in both modes) -->
    <div class="settings-row">
      <label for="face-index-input">Target Face Index:</label>
      <input type="number" id="face-index-input" value="-1" min="-1" max="10" />
      <span class="hint">(-1 = All)</span>
      
      <div style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
        <label for="vcam-toggle" style="cursor: pointer;">Virtual Cam:</label>
        <input type="checkbox" id="vcam-toggle" />
      </div>
    </div>

    <!-- Upload Zone: Target Image -->
    <section class="card" id="target-card">
      <div class="card-label">
        <span class="step-num">2</span>
        <span>Target Image</span>
        <span class="hint">Where to place the face</span>
      </div>
      <label class="drop-zone" id="target-drop" for="target-input">
        <input type="file" id="target-input" accept="image/*" hidden />
        <div class="drop-inner" id="target-inner">
          <svg class="drop-icon" viewBox="0 0 24 24" fill="none">
            <path d="M12 16V8M12 8l-3 3M12 8l3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="3" y="3" width="18" height="18" rx="4" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2"/>
          </svg>
          <span class="drop-text">Click or drag an image</span>
        </div>
        <img class="preview-img hidden" id="target-preview" alt="Target preview" />
      </label>
    </section>

    <!-- Camera Preview Zone -->
    <section class="card hidden" id="camera-card">
      <div class="card-label">
        <span class="step-num">2</span>
        <span>Live Camera</span>
        <span class="hint">Real-time face swap</span>
      </div>
      <div class="camera-container">
        <video id="camera-video" autoplay playsinline muted class="video-capture"></video>
        <canvas id="camera-canvas" class="preview-canvas"></canvas>
        <div class="camera-stats" id="camera-stats">Live: Tx 0 | Rx 0</div>
        <button class="btn-stop-camera hidden" id="stop-camera-btn">Stop Camera</button>
        <div class="camera-overlay" id="camera-overlay">
          <svg class="camera-icon" viewBox="0 0 24 24" fill="none">
            <path d="M15 10L19 7V17L15 14V10Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="3" y="5" width="12" height="14" rx="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Start Camera</span>
        </div>
      </div>
    </section>

    <!-- Swap Button -->
    <button class="btn-swap" id="swap-btn" disabled>
      <span class="btn-bg"></span>
      <svg class="btn-icon" viewBox="0 0 20 20" fill="none">
        <path d="M4 10h12M13 7l3 3-3 3" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span id="btn-label">Swap Face</span>
    </button>

    <!-- Progress Bar -->
    <div class="progress-wrap hidden" id="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
      <span class="progress-text" id="progress-text">Processing…</span>
    </div>

    <!-- Result -->
    <section class="result-section hidden" id="result-section">
      <div class="card-label">
        <span class="step-num done">✓</span>
        <span>Result</span>
        <button class="copy-btn" id="download-btn" title="Download result">
          <svg viewBox="0 0 20 20" fill="none" width="14" height="14">
            <path d="M10 3v10M7 10l3 3 3-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 17h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          Download
        </button>
      </div>
      <div class="result-img-wrap">
        <img id="result-img" class="result-img" alt="Swapped face result" />
        <div class="result-shine"></div>
      </div>
    </section>

    <!-- Error Toast -->
    <div class="toast hidden" id="error-toast">
      <svg viewBox="0 0 20 20" fill="none" width="16" height="16">
        <circle cx="10" cy="10" r="8" stroke="#f87171" stroke-width="1.5"/>
        <path d="M10 6v4M10 13v1" stroke="#f87171" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span id="error-msg">Something went wrong.</span>
    </div>

    <footer class="footer">Powered by Roop • InsightFace • Runs 100% Locally</footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
